repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.11
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # Runs the project's own mypy rather than an isolated copy with its own pins.
  # mirrors-mypy pinned its own pandas-stubs/pandera versions, which drifted from
  # pyproject and made the hook and `make lint` disagree — to the point where a
  # `# type: ignore` demanded by one was reported unused by the other.
  # pass_filenames is off so the hook checks the whole project, exactly like
  # `make lint`: whole-suite analysis catches errors a per-file run does not.
  - repo: local
    hooks:
      - id: mypy
        name: mypy (project environment)
        entry: mypy
        language: system
        types: [python]
        pass_filenames: false
        args: [src/, tests/]
