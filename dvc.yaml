stages:
  s01_ingest:
    cmd: python -m ingestion_patrimoine_mtl --stage 01
    deps:
      - rawData/edifices_patrimoine.csv
      - src/ingestion_patrimoine_mtl/config.py
      - src/ingestion_patrimoine_mtl/schemas.py
      - src/ingestion_patrimoine_mtl/utils/hashing.py
      - src/ingestion_patrimoine_mtl/pipeline/s01_ingest.py
    outs:
      - data/01_raw/buildings_raw.parquet

  s01b_rpcq:
    cmd: python -m ingestion_patrimoine_mtl --stage 01b
    deps:
      - rawData/rpcq/immeubles_classes.csv
      - rawData/rpcq/immeubles_cites.csv
      - src/ingestion_patrimoine_mtl/config.py
      - src/ingestion_patrimoine_mtl/models.py
      - src/ingestion_patrimoine_mtl/schemas.py
      - src/ingestion_patrimoine_mtl/utils/hashing.py
      - src/ingestion_patrimoine_mtl/pipeline/s01b_rpcq.py
    outs:
      - data/01b_rpcq/rpcq_raw.parquet

  s02_clean:
    cmd: python -m ingestion_patrimoine_mtl --stage 02
    deps:
      - data/01_raw/buildings_raw.parquet
      - src/ingestion_patrimoine_mtl/config.py
      - src/ingestion_patrimoine_mtl/schemas.py
      - src/ingestion_patrimoine_mtl/pipeline/s02_clean.py
    outs:
      - data/02_clean/buildings_clean.parquet

  s03_normalize:
    cmd: python -m ingestion_patrimoine_mtl --stage 03
    deps:
      - data/02_clean/buildings_clean.parquet
      - src/ingestion_patrimoine_mtl/config.py
      - src/ingestion_patrimoine_mtl/schemas.py
      - src/ingestion_patrimoine_mtl/utils/geo.py
      - src/ingestion_patrimoine_mtl/pipeline/s03_normalize.py
    outs:
      - data/03_normalized/buildings_normalized.parquet
